<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Toi ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4a4a4a;
            text-align: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            max-width: 85%;
            width: 350px;
            position: relative;
        }
        h1 { color: #ff4d6d; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.5; }
        
        /* Style du formulaire et boutons */
        .btn-container {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            position: relative;
            height: 50px;
        }
        .btn {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #btn-non {
            background-color: #777;
            position: absolute;
        }
        textarea {
            width: 90%;
            height: 60px;
            margin-top: 15px;
            border-radius: 10px;
            border: 1px solid #ffb3c6;
            padding: 10px;
            font-family: inherit;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Pour ma chérie ❤️</h1>
        <p>Est-ce que tu m'aimes autant que je t'aime ?</p>
        
        <!-- Formulaire de réponse -->
        <form action="https://web3forms.com" method="POST" id="form-reponse">
            <!-- Remplacer VOTRE_CLE_ICI par la clé reçue sur web3forms.com -->
            <input type="hidden" name="access_key" value="e3a458f8-053d-44fc-a762-a8220da46356>
            <input type="hidden" name="subject" value="Nouvelle réponse de ta copine ! ❤️">
            
            <div class="btn-container">
                <button type="submit" name="Reponse" value="OUI !" class="btn" id="btn-oui">OUI !</button>
                <button type="button" class="btn" id="btn-non" onmouseover="fuiteBouton()" onclick="fuiteBouton()">NON</button>
            </div>

            <textarea name="Petit_mot" placeholder="Laisse-moi un petit mot doux ici..."></textarea>
        </form>
    </div>

    <script>
        // Fonction amusante : le bouton NON s'enfuit quand on l'approche ou le touche sur iPhone
        function fuiteBouton() {
            const btnNon = document.getElementById('btn-non');
            // Calcule une position aléatoire dans la carte
            const x = Math.random() * 150 - 75; 
            const y = Math.random() * 150 - 75;
            
            btnNon.style.transform = `translate(${x}px, ${y}px)`;
        }

        // Message de confirmation après envoi
        document.getElementById('form-reponse').addEventListener('submit', function() {
            alert("Merci mon amour ! Ta réponse m'a bien été envoyée. ❤️");
        });
    </script>

</body>
</html>
